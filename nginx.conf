server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Enrutamiento SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso a la API en Laravel
    location /api/ {
        proxy_pass http://service:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para archivos e imágenes
    location /media/ {
        proxy_pass http://service:8080/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health check directo a la API
    location /health {
        proxy_pass http://service:8080/health;
        proxy_http_version 1.1;
    }
}
